<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stark Clutch Settings</title>
  <link href="./Clutch and Throttle Settings_files/tailwind.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
    h1 { text-align: center; margin-top: 0; }
    h2 { text-align: center; }
    h3 { text-align: center; font-size: 20px; }
    .container { padding: 10px; max-width: 800px; margin: 0 auto; }
    .connectionContainer { display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
    button {
      padding: 10px 20px; font-size: 16px; background-color: #4CAF50;
      color: white; border: none; border-radius: 5px; margin: 5px;
      cursor: pointer; width: 47%; box-sizing: border-box;
    }
    button:hover { background-color: #45a049; }
    .button-red { background-color: red !important; }
    .button-red:hover { background-color: rgb(255,75,75) !important; }
    .button-full { width: 97%; }
    p { font-size: 18px; text-align: center; }
    .chart-container { width: 100%; position: relative; }
    .section { display: none; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 6px;
      background: linear-gradient(to right, #2a86d6 50%, #d3d3d3 50%);
      border-radius: 5px; outline: none; margin: 10px 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 20px; height: 20px; background: #fff;
      border: 2px solid #2a86d6; border-radius: 50%; cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 20px; height: 20px; background: #fff;
      border: 2px solid #2a86d6; border-radius: 50%; cursor: pointer;
    }
    .slider-row { display: flex; align-items: center; gap: 10px; }
    .slider-row input[type="range"] { flex: 1; }
    .slider-value { min-width: 36px; text-align: right; font-size: 14px; color: #333; }
    .card {
      background: white; border-radius: 10px;
      padding: 15px; margin: 12px 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .audio-select {
      width: 100%; padding: 8px; border-radius: 5px;
      border: 1px solid #ccc; background: white; margin-top: 5px;
    }
    label { display: block; font-size: 14px; font-weight: bold; color: #555; margin-top: 8px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) {
      .grid2 { grid-template-columns: 1fr; }
      h1 { font-size: 22px; }
      button { font-size: 13px; }
    }
    .badge-new {
      display: inline-block; background: #4CAF50; color: white;
      font-size: 11px; padding: 2px 7px; border-radius: 10px;
      margin-left: 8px; vertical-align: middle;
    }
    #verticalVoltageLine {
      position: absolute;
      width: 2px; background-color: red;
      transition: left 0.1s ease; z-index: 20; pointer-events: none;
    }
    #verticalVoltageLineA0 {
      position: absolute;
      width: 2px; background-color: #2a86d6;
      transition: left 0.1s ease; z-index: 20; pointer-events: none;
    }
  </style>
</head>
<body>
<div class="container">

  <h1>Stark Clutch</h1>

  <!-- ── Всегда видно ── -->
  <div class="connectionContainer">
    <button id="connectBleButton">Connect</button>
    <button id="disconnectBleButton">Disconnect</button>
  </div>
  <p>State: <strong><span id="bleState" style="color:#d13a30;">Disconnected</span></strong></p>

  <!-- ── Блок Lock Bike (появляется если найдена характеристика 0010) ── -->
  <div id="bikeLockSection" class="section">
    <div class="card">
      <button id="bikeLockButton" class="button-full">Lock Bike</button>
    </div>
  </div>

  <!-- ── Базовый блок (любая прошивка) ── -->
  <div id="basicSection" class="section">

    <!-- График кривых -->
    <div class="card">
      <div class="chart-container">
        <canvas id="chartJSContainer"></canvas>
        <div id="verticalVoltageLine"></div>
        <div id="verticalVoltageLineA0"></div>
      </div>
      <div class="connectionContainer" style="margin-top:10px;">
        <button id="saveDropdownValue">Save</button>
        <button id="loadDropdownValue">Load</button>
      </div>
      <div class="connectionContainer">
        <button id="setDefaultValue" style="background:#888;">Default</button>
      </div>
    </div>

    <!-- Старые ползунки фильтра -->
    <div class="card">
      <label>Flywheel Acceleration</label>
      <div class="slider-row">
        <input type="range" id="slider1" min="1" max="30" value="15">
        <span class="slider-value" id="val1">15</span>
      </div>
      <label>Flywheel Deceleration</label>
      <div class="slider-row">
        <input type="range" id="slider3" min="1" max="30" value="15">
        <span class="slider-value" id="val3">15</span>
      </div>
      <label>Clutch Engagement Speed</label>
      <div class="slider-row">
        <input type="range" id="slider4" min="1" max="81" value="15">
        <span class="slider-value" id="val4">15</span>
      </div>
    </div>

    <!-- Звук двигателя -->
    <div class="card">
      <h3>Engine Sound</h3>
      <div class="grid2">
        <div>
          <label>Volume</label>
          <div class="slider-row">
            <input type="range" id="volSlider" min="0" max="100" value="50">
            <span class="slider-value" id="volVal">50</span>
          </div>
        </div>
        <div>
          <label>Waveform</label>
          <select id="waveType" class="audio-select">
            <option value="sawtooth">Sawtooth (Engine-like)</option>
            <option value="sine">Sine (Soft)</option>
            <option value="square">Square (Aggressive)</option>
            <option value="triangle">Triangle (Hollow)</option>
          </select>
        </div>
        <div>
          <label>Idle Freq (Hz)</label>
          <div class="slider-row">
            <input type="range" id="freqMinSlider" min="20" max="200" value="40">
            <span class="slider-value" id="freqMinVal">40</span>
          </div>
        </div>
        <div>
          <label>Max Freq (Hz)</label>
          <div class="slider-row">
            <input type="range" id="freqMaxSlider" min="100" max="1000" value="300">
            <span class="slider-value" id="freqMaxVal">300</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Калибровка -->
    <div class="card">
      <h3>Clutch Calibration</h3>
      <p style="font-size:14px;">
        Value: <span id="voltageContainerA0">-</span> &nbsp;|&nbsp;
        Pressed: <span id="fullyPressedValueA0">-</span> &nbsp;|&nbsp;
        Released: <span id="fullyReleasedValueA0">-</span>
      </p>
      <div class="connectionContainer">
        <button id="savePressedButton">Save Clutch Pressed</button>
        <button id="saveReleasedButton">Save Clutch Released</button>
      </div>

      <h3 style="margin-top:16px;">Throttle Calibration</h3>
      <p style="font-size:14px;">
        Value: <span id="voltageContainerA1">-</span> &nbsp;|&nbsp;
        Open: <span id="fullyPressedValueA1">-</span> &nbsp;|&nbsp;
        Closed: <span id="fullyReleasedValueA1">-</span>
      </p>
      <div class="connectionContainer">
        <button id="savePressedButtonA1">Save Throttle Open</button>
        <button id="saveReleasedButtonA1">Save Throttle Closed</button>
      </div>
    </div>

  </div><!-- /basicSection -->

  <!-- ── Блок Flywheel v2 (появляется если найдена характеристика 000A) ── -->
  <div id="flywheelSection" class="section">
    <div class="card">
      <h3>2-Stroke Flywheel Effect <span class="badge-new">v2</span></h3>

      <label>Rise under load (clutch released)</label>
      <div class="slider-row">
        <input type="range" id="fw_riseLoaded" min="1" max="100" value="5">
        <span class="slider-value" id="fw_riseLoaded_val">5</span>
      </div>

      <label>Fall under load (clutch released)</label>
      <div class="slider-row">
        <input type="range" id="fw_fallLoaded" min="1" max="100" value="8">
        <span class="slider-value" id="fw_fallLoaded_val">8</span>
      </div>

      <label>Rise unloaded (clutch pressed)</label>
      <div class="slider-row">
        <input type="range" id="fw_riseUnloaded" min="1" max="200" value="30">
        <span class="slider-value" id="fw_riseUnloaded_val">30</span>
      </div>

      <label>Fall unloaded (clutch pressed)</label>
      <div class="slider-row">
        <input type="range" id="fw_fallUnloaded" min="1" max="200" value="50">
        <span class="slider-value" id="fw_fallUnloaded_val">50</span>
      </div>
    </div>

    <div class="card">
      <h3>Powerband <span class="badge-new">v2</span></h3>

      <label>Powerband threshold (%)</label>
      <div class="slider-row">
        <input type="range" id="fw_pbThreshold" min="0" max="100" value="40">
        <span class="slider-value" id="fw_pbThreshold_val">40</span>
      </div>

      <label>Powerband rise rate</label>
      <div class="slider-row">
        <input type="range" id="fw_pbRiseRate" min="1" max="200" value="80">
        <span class="slider-value" id="fw_pbRiseRate_val">80</span>
      </div>
    </div>

    <div class="card">
      <h3>Rev Hang <span class="badge-new">v2</span></h3>

      <label>Hang duration (ms)</label>
      <div class="slider-row">
        <input type="range" id="fw_hangDuration" min="0" max="500" value="200">
        <span class="slider-value" id="fw_hangDuration_val">200</span>
      </div>

      <label>Hang threshold (clutch pull speed)</label>
      <div class="slider-row">
        <input type="range" id="fw_hangThreshold" min="1" max="50" value="15">
        <span class="slider-value" id="fw_hangThreshold_val">15</span>
      </div>
    </div>

    <div class="card">
      <h3>Clutch Snap <span class="badge-new">v2</span></h3>

      <label>Snap boost (%)</label>
      <div class="slider-row">
        <input type="range" id="fw_snapBoost" min="100" max="200" value="130">
        <span class="slider-value" id="fw_snapBoost_val">130</span>
      </div>

      <label>Snap duration (ms)</label>
      <div class="slider-row">
        <input type="range" id="fw_snapDuration" min="0" max="300" value="80">
        <span class="slider-value" id="fw_snapDuration_val">80</span>
      </div>
    </div>
  </div><!-- /flywheelSection -->

</div><!-- /container -->

<script src="./Clutch and Throttle Settings_files/chart.js.download"></script>
<script src="./Clutch and Throttle Settings_files/lodash"></script>
<script src="./Clutch and Throttle Settings_files/chartjs-plugin-datalabels"></script>
<script src="./Clutch and Throttle Settings_files/chartjs-plugin-dragdata"></script>

<script>
  // ── BLE UUIDs ──
  const SERVICE_UUID        = '19b10000-e8f2-537e-4f6c-d104768a1214';
  const UUID_SENSOR         = '19b10001-e8f2-537e-4f6c-d104768a1214';
  const UUID_COMMAND        = '19b10002-e8f2-537e-4f6c-d104768a1214';
  const UUID_COEFS          = '19b10004-e8f2-537e-4f6c-d104768a1214';
  const UUID_DEF_COEFS      = '19b10005-e8f2-537e-4f6c-d104768a1214';
  const UUID_ACOEF1         = '19b10006-e8f2-537e-4f6c-d104768a1214';
  const UUID_ASTEP1         = '19b10007-e8f2-537e-4f6c-d104768a1214';
  const UUID_ACOEF2         = '19b10008-e8f2-537e-4f6c-d104768a1214';
  const UUID_ASTEP2         = '19b10009-e8f2-537e-4f6c-d104768a1214';
  const UUID_BIKELOCK       = '19b10010-e8f2-537e-4f6c-d104768a1214';
  // v2 flywheel UUIDs
  const UUID_FW_RISE_LOADED   = '19b1000a-e8f2-537e-4f6c-d104768a1214';
  const UUID_FW_FALL_LOADED   = '19b1000b-e8f2-537e-4f6c-d104768a1214';
  const UUID_FW_RISE_UNLOADED = '19b1000c-e8f2-537e-4f6c-d104768a1214';
  const UUID_FW_FALL_UNLOADED = '19b1000d-e8f2-537e-4f6c-d104768a1214';
  const UUID_FW_PB_THRESHOLD  = '19b1000e-e8f2-537e-4f6c-d104768a1214';
  const UUID_FW_PB_RISERATE   = '19b1000f-e8f2-537e-4f6c-d104768a1214';
  const UUID_FW_HANG_DUR      = '19b10011-e8f2-537e-4f6c-d104768a1214';
  const UUID_FW_HANG_THR      = '19b10012-e8f2-537e-4f6c-d104768a1214';
  const UUID_FW_SNAP_BOOST    = '19b10013-e8f2-537e-4f6c-d104768a1214';
  const UUID_FW_SNAP_DUR      = '19b10014-e8f2-537e-4f6c-d104768a1214';

  // ── BLE операции в очереди ──
  class BLEQueue {
    constructor() { this.queue = []; this.busy = false; }
    run(op) {
      return new Promise((res, rej) => {
        this.queue.push({ op, res, rej });
        this.next();
      });
    }
    async next() {
      if (this.busy || !this.queue.length) return;
      this.busy = true;
      await new Promise(r => setTimeout(r, 10));
      const { op, res, rej } = this.queue.shift();
      try { res(await op()); } catch(e) { rej(e); } finally { this.busy = false; this.next(); }
    }
  }
  const q = new BLEQueue();

  // ── Состояние ──
  let bleDevice, service;
  let charSensor, charCommand, charCoefs, charDefCoefs;
  let charACoef1, charAStep1, charACoef2, charAStep2;
  let charBikeLock = null;
  let charFW = {};
  let bikeLockStatus = false;

  // ── Вспомогательные функции ──
  async function tryGetChar(uuid) {
    try { return await service.getCharacteristic(uuid); }
    catch { return null; }
  }

  function show(id) { document.getElementById(id).style.display = 'block'; }

  function updateSliderBg(el, color = '#2a86d6') {
    const pct = (el.value - el.min) / (el.max - el.min) * 100;
    el.style.background = `linear-gradient(to right, ${color} ${pct}%, #d3d3d3 ${pct}%)`;
  }

  function bindSlider(id, valId, color) {
    const el = document.getElementById(id);
    const vl = document.getElementById(valId);
    el.addEventListener('input', () => {
      vl.textContent = el.value;
      updateSliderBg(el, color);
    });
    vl.textContent = el.value;
    updateSliderBg(el, color);
    return el;
  }

  // ── Инициализация слайдеров ──
  const slider1 = bindSlider('slider1', 'val1');
  const slider3 = bindSlider('slider3', 'val3');
  const slider4 = bindSlider('slider4', 'val4');
  bindSlider('volSlider',    'volVal',    '#f59e0b');
  bindSlider('freqMinSlider','freqMinVal','#3b82f6');
  bindSlider('freqMaxSlider','freqMaxVal','#ef4444');

  ['fw_riseLoaded','fw_fallLoaded','fw_riseUnloaded','fw_fallUnloaded',
   'fw_pbThreshold','fw_pbRiseRate','fw_hangDuration','fw_hangThreshold',
   'fw_snapBoost','fw_snapDuration'].forEach(id => bindSlider(id, id+'_val'));

  // ── Звук двигателя ──
  let audioCtx = null, oscillator = null, gainNode = null;
  let masterVol = 0.5, freqMin = 40, freqMax = 300;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    oscillator = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(600, audioCtx.currentTime);
    oscillator.type = document.getElementById('waveType').value;
    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    oscillator.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.start();
  }

  let lastSound = 0;
  function updateEngineSound(v, minV, maxV) {
    if (!audioCtx || !oscillator) return;
    const now = performance.now();
    if (now - lastSound < 20) return;
    lastSound = now;
    const norm = Math.max(0, Math.min(1, (v - minV) / (maxV - minV)));
    oscillator.frequency.setTargetAtTime(freqMin + norm * (freqMax - freqMin), audioCtx.currentTime, 0.05);
    gainNode.gain.setTargetAtTime(v === 0 ? 0 : masterVol * (0.2 + norm * 0.8), audioCtx.currentTime, 0.05);
  }

  function saveAudioSettings() {
    localStorage.setItem('audioSettings', JSON.stringify({
      masterVol, freqMin, freqMax,
      wave: document.getElementById('waveType').value
    }));
  }

  function loadAudioSettings() {
    const s = JSON.parse(localStorage.getItem('audioSettings') || 'null');
    if (!s) return;
    masterVol = s.masterVol; freqMin = s.freqMin; freqMax = s.freqMax;
    document.getElementById('volSlider').value = masterVol * 100;
    document.getElementById('freqMinSlider').value = freqMin;
    document.getElementById('freqMaxSlider').value = freqMax;
    if (s.wave) document.getElementById('waveType').value = s.wave;
    ['volSlider','freqMinSlider','freqMaxSlider'].forEach(id => {
      const el = document.getElementById(id);
      const colors = { volSlider:'#f59e0b', freqMinSlider:'#3b82f6', freqMaxSlider:'#ef4444' };
      updateSliderBg(el, colors[id]);
      document.getElementById(id.replace('Slider','Val') || id+'Val').textContent = el.value;
    });
    document.getElementById('volVal').textContent = document.getElementById('volSlider').value;
    document.getElementById('freqMinVal').textContent = freqMin;
    document.getElementById('freqMaxVal').textContent = freqMax;
  }

  document.getElementById('volSlider').addEventListener('input', e => {
    masterVol = e.target.value / 100;
    saveAudioSettings();
  });
  document.getElementById('freqMinSlider').addEventListener('input', e => {
    freqMin = parseInt(e.target.value);
    saveAudioSettings();
  });
  document.getElementById('freqMaxSlider').addEventListener('input', e => {
    freqMax = parseInt(e.target.value);
    saveAudioSettings();
  });
  document.getElementById('waveType').addEventListener('change', e => {
    if (oscillator) oscillator.type = e.target.value;
    saveAudioSettings();
  });

  loadAudioSettings();

  // ── График ──
  const defaultClutch = [0,6,14,30,54,71,81,86,90,94,100];
  const defaultGas    = [0,18,28,37,45,53,61,70,80,90,100];

  const chartCfg = {
    type: 'line',
    options: {
      plugins: { datalabels: { display: false } },
      scales: {
        x: { type: 'linear', min: 0, max: 100, ticks: { display: false }, grid: { display: true } },
        y: { min: 0, max: 100, ticks: { display: false }, grid: { display: true } }
      }
    },
    data: {
      labels: Array.from({length:11}, (_,i) => `P${i}`),
      datasets: [
        {
          label: 'Clutch',
          data: JSON.parse(localStorage.getItem('chartDataClutch')) ||
                defaultClutch.map((y,i) => ({ x: i*10, y })),
          fill: true, tension: 0.4, borderWidth: 2, pointHitRadius: 25
        },
        {
          label: 'Gas',
          data: JSON.parse(localStorage.getItem('chartDataGas')) ||
                defaultGas.map((y,i) => ({ x: i*10, y })),
          fill: true, tension: 0.4, borderWidth: 2, pointHitRadius: 25
        }
      ]
    }
  };

  let myChart;
  window.addEventListener('load', () => {
    const ctx = document.getElementById('chartJSContainer').getContext('2d');
    myChart = new Chart(ctx, chartCfg);
    myChart.options.plugins.dragData = {
      onDragEnd: () => {
        localStorage.setItem('chartDataClutch', JSON.stringify(myChart.data.datasets[0].data));
        localStorage.setItem('chartDataGas',    JSON.stringify(myChart.data.datasets[1].data));
      }
    };
  });

  async function fetchChartFromBle() {
    const val = await q.run(() => charCoefs.readValue());
    const arr = new Float64Array(val.buffer);
    if (arr.length === 22) {
      myChart.data.datasets[0].data = Array.from(arr).slice(0,11).map((y,i) => ({ x:i*10, y }));
      myChart.data.datasets[1].data = Array.from(arr).slice(11,22).map((y,i) => ({ x:i*10, y }));
      myChart.update();
    }
  }

  async function sendChartToBle() {
    const combined = new Float64Array([
      ...myChart.data.datasets[0].data.map(p => p.y),
      ...myChart.data.datasets[1].data.map(p => p.y)
    ]);
    await q.run(() => charCoefs.writeValue(new Uint8Array(combined.buffer)));
  }

  // ── Загрузка / сохранение слайдеров v1 ──
  async function loadSlidersFromBle() {
    try {
      const c1 = await q.run(() => charACoef1.readValue());
      slider1.value = Math.round(new Float32Array(c1.buffer)[0] * 100);
      document.getElementById('val1').textContent = slider1.value;
      updateSliderBg(slider1);

      const c2 = await q.run(() => charACoef2.readValue());
      slider3.value = Math.round(new Float32Array(c2.buffer)[0] * 100);
      document.getElementById('val3').textContent = slider3.value;
      updateSliderBg(slider3);

      const s2 = await q.run(() => charAStep2.readValue());
      slider4.value = new Int16Array(s2.buffer)[0];
      document.getElementById('val4').textContent = slider4.value;
      updateSliderBg(slider4);
    } catch(e) { console.error('loadSliders:', e); }
  }

  slider1.addEventListener('input', () => {
    q.run(() => charACoef1.writeValue(new Float32Array([slider1.value/100])));
  });
  slider3.addEventListener('input', () => {
    q.run(() => charACoef2.writeValue(new Float32Array([slider3.value/100])));
  });
  slider4.addEventListener('input', () => {
    q.run(() => charAStep2.writeValue(new Int16Array([parseInt(slider4.value)])));
  });

  // ── Flywheel слайдеры v2 ──
  const fwSliders = [
    { id: 'fw_riseLoaded',   uuid: UUID_FW_RISE_LOADED,   type: 'float' },
    { id: 'fw_fallLoaded',   uuid: UUID_FW_FALL_LOADED,   type: 'float' },
    { id: 'fw_riseUnloaded', uuid: UUID_FW_RISE_UNLOADED, type: 'float' },
    { id: 'fw_fallUnloaded', uuid: UUID_FW_FALL_UNLOADED, type: 'float' },
    { id: 'fw_pbThreshold',  uuid: UUID_FW_PB_THRESHOLD,  type: 'float' },
    { id: 'fw_pbRiseRate',   uuid: UUID_FW_PB_RISERATE,   type: 'float' },
    { id: 'fw_hangDuration', uuid: UUID_FW_HANG_DUR,      type: 'float' },
    { id: 'fw_hangThreshold',uuid: UUID_FW_HANG_THR,      type: 'float' },
    { id: 'fw_snapBoost',    uuid: UUID_FW_SNAP_BOOST,    type: 'float_pct' }, // 100-200 → 1.0-2.0
    { id: 'fw_snapDuration', uuid: UUID_FW_SNAP_DUR,      type: 'float' },
  ];

  async function loadFWSliders() {
    for (const s of fwSliders) {
      try {
        const ch = charFW[s.id];
        if (!ch) continue;
        const val = await q.run(() => ch.readValue());
        const f = new Float32Array(val.buffer)[0];
        const el = document.getElementById(s.id);
        el.value = s.type === 'float_pct' ? Math.round(f * 100) : Math.round(f);
        document.getElementById(s.id + '_val').textContent = el.value;
        updateSliderBg(el);
      } catch(e) { console.error('loadFW', s.id, e); }
    }
  }

  fwSliders.forEach(s => {
    document.getElementById(s.id).addEventListener('input', () => {
      const ch = charFW[s.id];
      if (!ch) return;
      const v = parseFloat(document.getElementById(s.id).value);
      const f = s.type === 'float_pct' ? v / 100 : v;
      q.run(() => ch.writeValue(new Float32Array([f])));
    });
  });

  // ── Bike Lock ──
  function updateBikeLockBtn() {
    const btn = document.getElementById('bikeLockButton');
    btn.classList.toggle('button-red', bikeLockStatus);
    btn.textContent = bikeLockStatus ? 'Unlock Bike' : 'Lock Bike';
  }

  async function fetchBikeLock() {
    const val = await q.run(() => charBikeLock.readValue());
    bikeLockStatus = new Int8Array(val.buffer)[0] !== 0;
    updateBikeLockBtn();
  }

  document.getElementById('bikeLockButton').addEventListener('click', async () => {
    await q.run(() => charBikeLock.writeValue(new Uint8Array([bikeLockStatus ? 0 : 1])));
    await fetchBikeLock();
  });

  // ── Команды калибровки ──
  function bindCmd(btnId, cmd) {
    document.getElementById(btnId).addEventListener('click', () => {
      if (charCommand) q.run(() => charCommand.writeValue(new TextEncoder().encode(cmd)));
    });
  }
  bindCmd('savePressedButton',  'Fully Pressed A0');
  bindCmd('saveReleasedButton', 'Fully Released A0');
  bindCmd('savePressedButtonA1','Fully Pressed A1');
  bindCmd('saveReleasedButtonA1','Fully Released A1');

  // ── Уведомления с датчиков ──
  function onSensorData(e) {
    const parts = new TextDecoder().decode(e.target.value).split(',');
    if (parts.length < 6) return;
    const curA0 = parseFloat(parts[0]);
    const curA1 = parseFloat(parts[3]);
    const prsA1 = parseFloat(parts[4]);
    const relA1 = parseFloat(parts[5]);

    document.getElementById('voltageContainerA0').textContent = curA0;
    document.getElementById('voltageContainerA1').textContent = curA1;
    document.getElementById('fullyPressedValueA0').textContent  = parts[1];
    document.getElementById('fullyReleasedValueA0').textContent = parts[2];
    document.getElementById('fullyPressedValueA1').textContent  = prsA1;
    document.getElementById('fullyReleasedValueA1').textContent = relA1;

    updateEngineSound(curA1, relA1, prsA1);

    // Вертикальные линии на графике
    const area   = myChart.chartArea;
    const areaW  = area.right - area.left;
    const areaH  = area.bottom - area.top;

    const pctA1  = Math.max(0, Math.min(100, (curA1 - relA1) / (prsA1 - relA1) * 100));
    const lineA1 = document.getElementById('verticalVoltageLine');
    lineA1.style.left   = (area.left + pctA1 / 100 * areaW) + 'px';
    lineA1.style.top    = area.top + 'px';
    lineA1.style.height = areaH + 'px';

    const prsA0  = parseFloat(parts[1]);
    const relA0  = parseFloat(parts[2]);
    const pctA0  = 100 - Math.max(0, Math.min(100, (curA0 - relA0) / (prsA0 - relA0) * 100));
    const lineA0 = document.getElementById('verticalVoltageLineA0');
    lineA0.style.left   = (area.left + pctA0 / 100 * areaW) + 'px';
    lineA0.style.top    = area.top + 'px';
    lineA0.style.height = areaH + 'px';
  }

  // ── Подключение ──
  document.getElementById('connectBleButton').addEventListener('click', async () => {
    try {
      initAudio();
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ name: 'Stark_Clutch' }],
        optionalServices: [SERVICE_UUID]
      });
      const server = await bleDevice.gatt.connect();
      service = await server.getPrimaryService(SERVICE_UUID);

      // 1. Сначала получаем ВСЕ характеристики (обязательные + опциональные)
      charSensor   = await service.getCharacteristic(UUID_SENSOR);
      charCommand  = await service.getCharacteristic(UUID_COMMAND);
      charCoefs    = await service.getCharacteristic(UUID_COEFS);
      charDefCoefs = await service.getCharacteristic(UUID_DEF_COEFS);
      charACoef1   = await service.getCharacteristic(UUID_ACOEF1);
      charAStep1   = await service.getCharacteristic(UUID_ASTEP1);
      charACoef2   = await service.getCharacteristic(UUID_ACOEF2);
      charAStep2   = await service.getCharacteristic(UUID_ASTEP2);

      charBikeLock = await tryGetChar(UUID_BIKELOCK);

      charFW['fw_riseLoaded']    = await tryGetChar(UUID_FW_RISE_LOADED);
      if (charFW['fw_riseLoaded']) {
        charFW['fw_fallLoaded']   = await tryGetChar(UUID_FW_FALL_LOADED);
        charFW['fw_riseUnloaded'] = await tryGetChar(UUID_FW_RISE_UNLOADED);
        charFW['fw_fallUnloaded'] = await tryGetChar(UUID_FW_FALL_UNLOADED);
        charFW['fw_pbThreshold']  = await tryGetChar(UUID_FW_PB_THRESHOLD);
        charFW['fw_pbRiseRate']   = await tryGetChar(UUID_FW_PB_RISERATE);
        charFW['fw_hangDuration'] = await tryGetChar(UUID_FW_HANG_DUR);
        charFW['fw_hangThreshold']= await tryGetChar(UUID_FW_HANG_THR);
        charFW['fw_snapBoost']    = await tryGetChar(UUID_FW_SNAP_BOOST);
        charFW['fw_snapDuration'] = await tryGetChar(UUID_FW_SNAP_DUR);
      }

      // 2. Показываем UI по найденным характеристикам
      document.getElementById('bleState').textContent = 'Connected';
      document.getElementById('bleState').style.color = '#24af24';

      show('basicSection');
      if (charBikeLock)              show('bikeLockSection');
      if (charFW['fw_riseLoaded'])   show('flywheelSection');

      // 3. Подписываемся на уведомления
      charSensor.startNotifications();
      charSensor.addEventListener('characteristicvaluechanged', onSensorData);

      // 4. Грузим данные — небольшая задержка чтобы BLE успел установиться
      await new Promise(r => setTimeout(r, 800));
      try { await fetchChartFromBle();  } catch(e) { console.error('chart:', e); }
      try { await loadSlidersFromBle(); } catch(e) { console.error('sliders:', e); }
      if (charBikeLock)            { try { await fetchBikeLock();  } catch(e) { console.error('bikeLock:', e); } }
      if (charFW['fw_riseLoaded']) { try { await loadFWSliders();  } catch(e) { console.error('fw:', e); } }

    } catch(e) {
      document.getElementById('bleState').textContent = 'Failed: ' + e;
      document.getElementById('bleState').style.color = '#d13a30';
    }
  });

  // ── Отключение ──
  document.getElementById('disconnectBleButton').addEventListener('click', () => {
    if (bleDevice && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
    }
    document.getElementById('bleState').textContent = 'Disconnected';
    document.getElementById('bleState').style.color = '#d13a30';
    document.getElementById('basicSection').style.display    = 'none';
    document.getElementById('bikeLockSection').style.display = 'none';
    document.getElementById('flywheelSection').style.display = 'none';
    if (gainNode) gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
  });

  // ── Кнопки графика ──
  document.getElementById('saveDropdownValue').addEventListener('click', sendChartToBle);
  document.getElementById('loadDropdownValue').addEventListener('click', fetchChartFromBle);
  document.getElementById('setDefaultValue').addEventListener('click', () => {
    myChart.data.datasets[0].data = defaultClutch.map((y,i) => ({ x:i*10, y }));
    myChart.data.datasets[1].data = defaultGas.map((y,i) => ({ x:i*10, y }));
    myChart.update();
  });
</script>
</body>
</html>
