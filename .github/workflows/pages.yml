name: Deploy Web Page

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get firmware from latest release
        run: |
          curl -fsSL \
            "https://github.com/${{ github.repository }}/releases/latest/download/firmware.bin" \
            -o web/firmware.bin \
            && echo "firmware.bin downloaded" \
            || echo "No release yet — firmware.bin skipped"
          curl -fsSL \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('body',''))" \
            > web/firmware_version.txt 2>/dev/null \
            || echo "unknown" > web/firmware_version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
