name: Build Firmware

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'platformio.ini'
      - 'lib/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware C3
        run: pio run -e seeed_xiao_esp32c3

      - name: Build firmware S3
        run: pio run -e seeed_xiao_esp32s3

      - name: Get firmware version
        id: ver
        run: |
          VER=$(grep -oP '(?<=#define FW_VERSION_BASE ")[^"]+' src/ble2sensorsNVSEUGENE.ino)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Version: $VER"

      - name: Rename firmware binaries
        run: |
          cp .pio/build/seeed_xiao_esp32c3/firmware.bin firmware_c3.bin
          cp .pio/build/seeed_xiao_esp32s3/firmware.bin firmware_s3.bin

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: "Firmware v${{ steps.ver.outputs.version }}"
          body: "${{ steps.ver.outputs.version }}"
          files: |
            firmware_c3.bin
            firmware_s3.bin
          make_latest: true

      - name: Add firmware to web folder
        run: |
          cp firmware_c3.bin web/firmware_c3.bin
          cp firmware_s3.bin web/firmware_s3.bin
          echo "${{ steps.ver.outputs.version }}" > web/firmware_version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
