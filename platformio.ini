; PlatformIO Project Configuration File

[common]
framework = arduino
board_build.partitions = partitions.csv
lib_deps =
	GyverFilters
	InterpolationLib
	Adafruit MCP4725

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
extends = common

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
extends = common
